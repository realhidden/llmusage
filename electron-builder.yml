appId: com.thisisdone.llmusage
productName: llmusage
directories:
  output: release
asar: true
compression: maximum
files:
  - dist/**
  - '!dist/**/*.map'
  - '!dist/**/*.test.js'
  - package.json
  - build/icons/**
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  icon: build/icons/icon.icns
  extendInfo:
    LSUIElement: 1
