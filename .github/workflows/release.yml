name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      # The release step below publishes; electron-builder's implicit tag
      # publishing uploaded unsigned DMGs and stray blockmaps first.
      - name: Package with electron-builder
        run: npx electron-builder --mac --arm64 --x64 --publish never

      # electron-builder names them llmusage-<v>-arm64.dmg and llmusage-<v>.dmg (x64).
      - name: Ad-hoc sign DMGs
        run: for f in release/*.dmg; do codesign --force --sign - "$f"; done

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
